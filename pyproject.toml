[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laya-classification"
version = "0.1.0"
description = "A Python foundation for classification with the Laya model."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Laya Classification contributors" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "fastapi>=0.115",
  "laya>=0.3.20",
  "python-dotenv>=1.0",
  "reportlab>=4.2",
  "typesafe-sdk>=0.7.2",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
laya-classify = "laya_classification.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/laya_classification"]
